<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGNITRON 2K25 - Registration</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
    --accent-color: #00f2fe;
    --dark-bg: #0a0a0f;
    --text-primary: #ffffff;
    --text-secondary: #b8bcc8;
  }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background-color: var(--dark-bg);
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* MATRIX BACKGROUND */
  canvas#matrix {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 0;
  }

  .form-container {
    position: relative;
    z-index: 1;
    background: rgba(0,0,0,0.6);
    border: 2px solid var(--accent-color);
    border-radius: 10px;
    padding: 3rem 4rem;
    width: 90%;
    max-width: 650px;
    backdrop-filter: blur(10px);
  }

  .form-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem,5vw,3rem);
    text-align: center;
    margin-bottom: 2rem;
    background: var(--primary-gradient);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .form-group { margin-bottom: 1.5rem; }
  .form-group label { display: block; margin-bottom: 0.5rem; color: var(--accent-color); text-transform: uppercase; font-weight: 700; }
  .form-group input, .form-group select { width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.1); border: 1px solid var(--text-secondary); border-radius: 5px; color: var(--text-primary); }

  .submit-btn {
    width: 100%;
    padding: 1rem;
    background: transparent;
    border: 2px solid var(--accent-color);
    color: var(--accent-color);
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: 1.2rem;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  /* LOADING OVERLAY */
  .loading-overlay {
    display: none;
    position: fixed;
    top:0; left:0;
    width:100%; height:100vh;
    background: rgba(0,0,0,0.8);
    z-index: 2;
    justify-content: center;
    align-items: center;
    font-family: 'Orbitron', monospace;
    color: var(--accent-color);
    font-size: 2rem;
  }

  .loading-overlay.visible { display: flex; }

  .success-container {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.95);
    position: fixed;
    top:0; left:0;
    width:100%; height:100vh;
    color: var(--accent-color);
    font-family: 'Orbitron', monospace;
    font-size: 2rem;
    z-index: 3;
  }
  .success-container.visible { display: flex; }
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="form-container">
  <h2 class="form-title">System Protocol: Register</h2>
  <form id="registration-form">
    <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
    <div class="form-group"><label>College</label><input type="text" name="college" required></div>
    <div class="form-group">
      <label>Year</label>
      <select name="year" required>
        <option value="" disabled selected>Select Year</option>
        <option value="1">1st Year</option>
        <option value="2">2nd Year</option>
        <option value="3">3rd Year</option>
        <option value="4">4th Year</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
    <div class="form-group"><label>Phone</label><input type="tel" name="phone" required></div>
    <div class="form-group">
      <label>Event</label>
      <select name="event_type" required>
        <option value="" disabled selected>Select Event</option>
        <option value="hackathon">HACKATHON</option>
        <option value="esports">ESPORTS</option>
        <option value="workshop">WORKSHOPS</option>
      </select>
    </div>
    <div class="form-group">
      <label>Gender</label>
      <select name="gender" required>
        <option value="" disabled selected>Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Pronouns</label>
      <select name="pronouns" required>
        <option value="" disabled selected>Select Pronouns</option>
        <option value="he/him">He/Him</option>
        <option value="she/her">She/Her</option>
        <option value="they/them">They/Them</option>
        <option value="ze/zir">Ze/Zir</option>
        <option value="other">Other</option>
      </select>
    </div>
    <button type="submit" class="submit-btn">Pay ₹1 & Register</button>
  </form>
</div>

<div class="loading-overlay" id="loadingOverlay">Loading...</div>
<div class="success-container" id="successContainer">Registration Successful!</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
// MATRIX BACKGROUND
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%";
const fontSize = 16;
const columns = canvas.width / fontSize;
const drops = Array(Math.floor(columns)).fill(1);

function drawMatrix() {
  ctx.fillStyle = "rgba(10,10,15,0.1)";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#0F0";
  ctx.font = fontSize + "px monospace";

  for(let i=0; i<drops.length; i++) {
    const text = letters[Math.floor(Math.random()*letters.length)];
    ctx.fillText(text, i*fontSize, drops[i]*fontSize);
    if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
  requestAnimationFrame(drawMatrix);
}
drawMatrix();

// FORM SUBMISSION
const form = document.getElementById('registration-form');
const successContainer = document.getElementById('successContainer');
const loadingOverlay = document.getElementById('loadingOverlay');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  loadingOverlay.classList.add('visible');

  const formData = Object.fromEntries(new FormData(form));

  try {
    const res = await fetch('/.netlify/functions/create-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...formData, amount: 1 })
    });
    const data = await res.json();
    if (!data.orderId) throw new Error('Order creation failed');

    const options = {
      key: data.key,
      amount: data.amount * 100,
      currency: data.currency,
      name: "IGNITRON 2K25",
      description: "Event Registration",
      order_id: data.orderId,
      handler: async function (response) {
        const verifyRes = await fetch('/.netlify/functions/verify-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...formData,
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature
          })
        });
        const verifyData = await verifyRes.json();
        loadingOverlay.classList.remove('visible');
        if (verifyData.success) {
          successContainer.classList.add('visible');
          form.reset();
        } else {
          alert('Payment succeeded but registration failed. Contact support.');
        }
      },
      prefill: { name: formData.name, email: formData.email, contact: formData.phone },
      theme: { color: "#00f2fe" }
    };
    const rzp = new Razorpay(options);
    rzp.open();

  } catch(err) {
    loadingOverlay.classList.remove('visible');
    console.error(err);
    alert('Error creating order. Try again.');
  }
});
</script>
</body>
</html>
