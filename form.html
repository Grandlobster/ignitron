<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGNITRON 2K25 - Registration</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  --accent-color: #00f2fe;
  --dark-bg: #0a0a0f;
  --text-primary: #fff;
  --text-secondary: #b8bcc8;
}

body {
  font-family:'Space Grotesk', sans-serif;
  background-color: var(--dark-bg);
  color: var(--text-primary);
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow-x:hidden;
}

#matrix-canvas {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:-1;
  opacity:0.3;
}

.form-container {
  background: rgba(255,255,255,0.05);
  border: 2px solid var(--accent-color);
  border-radius:10px;
  padding:3rem 4rem;
  width:90%;
  max-width:650px;
  box-shadow:0 0 40px rgba(0,242,254,0.2);
  backdrop-filter: blur(10px);
}

.form-title {
  font-family:'Orbitron', monospace;
  font-size: clamp(2rem,5vw,3rem);
  text-align:center;
  margin-bottom:2rem;
  background: var(--primary-gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.form-group {
  margin-bottom:1.5rem;
}

.form-group label {
  display:block;
  margin-bottom:0.5rem;
  color: var(--accent-color);
  text-transform: uppercase;
  font-weight:700;
}

.form-group input, .form-group select {
  width:100%;
  padding:0.75rem;
  background: rgba(255,255,255,0.1);
  border:1px solid var(--text-secondary);
  border-radius:5px;
  color: var(--text-primary);
  font-size:1rem;
}

.form-group input:focus, .form-group select:focus {
  outline:none;
  border-color: var(--accent-color);
  box-shadow:0 0 5px var(--accent-color);
}

.submit-btn {
  width:100%;
  padding:1rem;
  background:transparent;
  border:2px solid var(--accent-color);
  color: var(--accent-color);
  font-family:'Orbitron', monospace;
  font-weight:700;
  font-size:1.2rem;
  border-radius:5px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
}

.submit-btn::before {
  content:'';
  position:absolute;
  top:0; left:-100%;
  width:100%; height:100%;
  background:var(--primary-gradient);
  transform: skewX(-30deg);
  z-index:-1;
  transition: transform 0.5s cubic-bezier(0.8,0,0.2,1);
}

.submit-btn:hover::before { transform: translateX(100%) skewX(-30deg); }
.submit-btn:hover { color: var(--dark-bg); box-shadow:0 0 20px rgba(0,242,254,0.5); }

.success-container {
  position:fixed;
  top:0; left:0;
  width:100%; height:100vh;
  background: rgba(0,0,0,0.95);
  backdrop-filter: blur(15px);
  z-index:5000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  opacity:0; visibility:hidden;
  transition: opacity 0.5s ease;
}

.success-container.visible { opacity:1; visibility:visible; }

.success-message {
  font-family:'Orbitron', monospace;
  font-size: clamp(2rem,5vw,4rem);
  color: var(--accent-color);
  margin-bottom:2rem;
  text-align:center;
}

.success-back-btn {
  padding:1rem 2.5rem;
  border:2px solid var(--accent-color);
  border-radius:5px;
  color:var(--accent-color);
  font-family:'Orbitron', monospace;
  text-transform:uppercase;
  text-decoration:none;
  margin-top:2rem;
  transition: all 0.3s ease;
}

.success-back-btn:hover {
  color: var(--dark-bg);
  background: var(--accent-color);
  box-shadow:0 0 15px var(--accent-color);
}

@media (max-width:768px) { .form-container{padding:2rem;} }
</style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="form-container">
  <h2 class="form-title">System Protocol: Register</h2>
  <form id="registrationForm">
    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>
    </div>
    <div class="form-group">
      <label for="college">College</label>
      <input id="college" name="college" type="text" required>
    </div>
    <div class="form-group">
      <label for="phone">Phone Number</label>
      <input id="phone" name="phone" type="text" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div class="form-group">
      <label for="year">Year</label>
      <input id="year" name="year" type="number" min="1" max="4" required>
    </div>
    <div class="form-group">
      <label for="event">Event of Interest</label>
      <select id="event" name="event" required>
        <option value="">Select Event</option>
        <option value="hackathon">Hackathon</option>
        <option value="esports">ESPORTS</option>
        <option value="workshops">Workshops</option>
      </select>
    </div>
    <div class="form-group">
      <label for="pronouns">Pronouns</label>
      <select id="pronouns" name="pronouns" required>
        <option value="">Select Pronouns</option>
        <option value="he/him">He/Him</option>
        <option value="she/her">She/Her</option>
        <option value="they/them">They/Them</option>
        <option value="ze/zir">Ze/Zir</option>
        <option value="other">Other</option>
        <option value="prefer-not-to-say">Prefer not to say</option>
      </select>
    </div>
    <button type="submit" class="submit-btn">Submit</button>
  </form>
</div>

<div class="success-container" id="successContainer">
  <h2 class="success-message">DATA SUBMISSION SUCCESSFUL.</h2>
  <a href="form.html" class="success-back-btn">RETURN TO MAIN PROTOCOL</a>
</div>

<script>
// Matrix Rain
class MatrixRain {
  constructor() {
    this.canvas = document.getElementById('matrix-canvas');
    this.ctx = this.canvas.getContext('2d');
    this.characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()";
    this.fontSize = 14;
    this.columns = 0;
    this.drops = [];
    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.animate();
  }
  resize() {
    this.canvas.width = window.innerWidth;
    this.canvas.height = window.innerHeight;
    this.columns = Math.floor(this.canvas.width / this.fontSize);
    this.drops = Array(this.columns).fill(1);
  }
  animate() {
    this.ctx.fillStyle = 'rgba(0,5,16,0.04)';
    this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height);
    this.ctx.fillStyle = '#00ffff';
    this.ctx.font = this.fontSize + 'px monospace';
    for (let i=0; i<this.drops.length; i++){
      const text = this.characters[Math.floor(Math.random() * this.characters.length)];
      this.ctx.fillText(text, i*this.fontSize, this.drops[i]*this.fontSize);
      if (this.drops[i]*this.fontSize > this.canvas.height && Math.random()>0.975){
        this.drops[i]=0;
      }
      this.drops[i]++;
    }
    setTimeout(()=>requestAnimationFrame(()=>this.animate()),50);
  }
}

new MatrixRain();

// Form submission
const form = document.getElementById("registrationForm");
const successContainer = document.getElementById("successContainer");

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  const formData = new FormData(form);
  try {
    const res = await fetch("/.netlify/functions/create-order", {
      method:"POST",
      body: new URLSearchParams(formData).toString(),
      headers: { "Content-Type": "application/x-www-form-urlencoded" }
    });
    if(!res.ok) throw new Error("Server error");
    const data = await res.json();
    console.log("Razorpay Order ID:", data.orderId);
    successContainer.classList.add("visible");
    form.reset();
  } catch(err){
    alert("Submission failed: "+err.message);
  }
});
</script>

</body>
</html>
