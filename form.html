<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IGNITRON 2K25 - Registration</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Space Grotesk',sans-serif;background:#0a0a0f;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;}
  .form-container{background:rgba(255,255,255,0.05);padding:2rem 3rem;border-radius:10px;width:90%;max-width:600px;}
  .form-title{font-family:'Orbitron',monospace;font-size:2rem;text-align:center;margin-bottom:1.5rem;color:#00f2fe;}
  .form-group{margin-bottom:1rem;}
  .form-group label{display:block;margin-bottom:0.3rem;color:#00f2fe;font-weight:700;text-transform:uppercase;}
  .form-group input,.form-group select{width:100%;padding:0.5rem;border-radius:5px;border:1px solid #b8bcc8;background:rgba(255,255,255,0.1);color:#fff;}
  .submit-btn{width:100%;padding:1rem;border:2px solid #00f2fe;color:#00f2fe;font-family:'Orbitron',monospace;font-weight:700;font-size:1.2rem;border-radius:5px;cursor:pointer;background:transparent;}
  .submit-btn:hover{background:#00f2fe;color:#0a0a0f;}
</style>
</head>
<body>

<div class="form-container">
  <h2 class="form-title">System Protocol: Register</h2>
  <form id="registrationForm">
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required>
    </div>
    <div class="form-group">
      <label for="college">College</label>
      <input type="text" id="college" name="college" required>
    </div>
    <div class="form-group">
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div class="form-group">
      <label for="year">Year</label>
      <input type="number" id="year" name="year" min="1" max="4" required>
    </div>
    <div class="form-group">
      <label for="event">Event of Interest</label>
      <select id="event" name="eventType" required>
        <option value="" disabled selected>Select an Event</option>
        <option value="Hackathon">Hackathon</option>
        <option value="ESPORTS">ESPORTS</option>
        <option value="Workshops">Workshops</option>
      </select>
    </div>
    <div class="form-group">
      <label for="pronouns">Pronouns</label>
      <select id="pronouns" name="pronouns" required>
        <option value="" disabled selected>Select your Pronouns</option>
        <option value="he/him">He/Him</option>
        <option value="she/her">She/Her</option>
        <option value="they/them">They/Them</option>
        <option value="ze/zir">Ze/Zir</option>
        <option value="other">Other/Custom</option>
        <option value="prefer-not-to-say">Prefer not to say</option>
      </select>
    </div>
    <button type="submit" class="submit-btn">Submit & Pay ₹10</button>
  </form>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
document.getElementById('registrationForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const formData = {
    name: document.getElementById('name').value,
    college: document.getElementById('college').value,
    phone: document.getElementById('phone').value,
    email: document.getElementById('email').value,
    year: document.getElementById('year').value,
    eventType: document.getElementById('event').value,
    pronouns: document.getElementById('pronouns').value
  };

  try {
    // 1️⃣ Create order in backend
    const orderRes = await fetch('/.netlify/functions/create-order', {
      method: 'POST',
      body: JSON.stringify(formData)
    });
    const orderData = await orderRes.json();

    // 2️⃣ Fetch Razorpay key_id from secure function
    const keyRes = await fetch('/.netlify/functions/get-key');
    const { key_id } = await keyRes.json();

    // 3️⃣ Open Razorpay checkout
    const options = {
      key: key_id,
      amount: orderData.amount,
      currency: orderData.currency,
      order_id: orderData.order_id,
      handler: function(response) {
        alert('Payment Successful! Payment ID: ' + response.razorpay_payment_id);
      },
      prefill: {
        name: formData.name,
        email: formData.email,
        contact: formData.phone
      },
      theme: { color: "#00f2fe" }
    };
    const rzp = new Razorpay(options);
    rzp.open();

  } catch (err) {
    console.error(err);
    alert('Error creating order. Please try again.');
  }
});
</script>

</body>
</html>
