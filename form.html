<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGNITRON 2K25 - Registration</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --accent-color: #00f2fe;
      --dark-bg: #0a0a0f;
      --text-primary: #ffffff;
      --text-secondary: #b8bcc8;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: var(--dark-bg);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-container {
      background: rgba(255,255,255,0.05);
      border: 2px solid var(--accent-color);
      border-radius: 10px;
      padding: 3rem 4rem;
      width: 90%;
      max-width: 650px;
      backdrop-filter: blur(10px);
    }

    .form-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem,5vw,3rem);
      text-align: center;
      margin-bottom: 2rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: var(--accent-color); text-transform: uppercase; font-weight: 700; }
    .form-group input, .form-group select { width: 100%; padding: 0.75rem; background: rgba(255,255,255,0.1); border: 1px solid var(--text-secondary); border-radius: 5px; color: var(--text-primary); }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: transparent;
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      font-size: 1.2rem;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .success-container, .error-container {
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.95);
      position: fixed;
      top:0; left:0;
      width:100%; height:100vh;
      color: var(--accent-color);
      font-family: 'Orbitron', monospace;
      font-size: 2rem;
      padding: 2rem;
      text-align: center;
    }

    .visible { display: flex; }
  </style>
</head>
<body>

<div class="form-container">
  <h2 class="form-title">System Protocol: Register</h2>
  <form id="registration-form">
    <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
    <div class="form-group"><label>College</label><input type="text" name="college" required></div>
    <div class="form-group"><label>Year</label><input type="number" name="year" required min="1" max="4"></div>
    <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
    <div class="form-group"><label>Phone</label><input type="tel" name="phone" required></div>
    <div class="form-group">
      <label>Event</label>
      <select name="event_type" required>
        <option value="" disabled selected>Select Event</option>
        <option value="hackathon">HACKATHON</option>
        <option value="esports">ESPORTS</option>
        <option value="workshops">WORKSHOPS</option>
      </select>
    </div>
    <div class="form-group">
      <label>Gender</label>
      <select name="gender" required>
        <option value="" disabled selected>Select Gender</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Pronouns</label>
      <select name="pronouns" required>
        <option value="" disabled selected>Select Pronouns</option>
        <option value="he/him">He/Him</option>
        <option value="she/her">She/Her</option>
        <option value="they/them">They/Them</option>
        <option value="ze/zir">Ze/Zir</option>
        <option value="other">Other</option>
      </select>
    </div>
    <button type="submit" class="submit-btn">Pay ₹10 & Register</button>
  </form>
</div>

<div class="success-container" id="successContainer">
  Registration Successful!<br><br>
  You will receive a confirmation email shortly.
</div>
<div class="error-container" id="errorContainer">
  Payment or registration failed.<br><br>
  Please try again or contact support.
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const form = document.getElementById('registration-form');
const successContainer = document.getElementById('successContainer');
const errorContainer = document.getElementById('errorContainer');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const formData = Object.fromEntries(new FormData(form));

  try {
    // 1️⃣ Create Razorpay order
    const res = await fetch('/.netlify/functions/create-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...formData, amount: 10 }) // ₹10
    });
    const data = await res.json();
    if (!data.orderId) throw new Error('Order creation failed');

    // 2️⃣ Razorpay Checkout
    const options = {
      key: data.key,
      amount: data.amount * 100,
      currency: data.currency,
      name: "IGNITRON 2K25",
      description: "Event Registration",
      order_id: data.orderId,
      handler: async function(response) {
        try {
          // 3️⃣ Verify payment
          const verify = await fetch('/.netlify/functions/verify-payment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...formData,
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            })
          });
          const verifyRes = await verify.json();
          if(verifyRes.success){
            successContainer.classList.add('visible');
            form.reset();
          } else {
            errorContainer.classList.add('visible');
          }
        } catch(err) {
          console.error(err);
          errorContainer.classList.add('visible');
        }
      },
      prefill: {
        name: formData.name,
        email: formData.email,
        contact: formData.phone
      },
      theme: { color: "#00f2fe" }
    };
    const rzp = new Razorpay(options);
    rzp.open();

  } catch(err) {
    console.error(err);
    errorContainer.classList.add('visible');
  }
});
</script>
</body>
</html>
