<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Wrangling - Challenge</title>
<style>
  /* Basic setup */
  * {
    box-sizing: border-box;
  }
  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Courier New", monospace;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #0ff;
  }

  /* Background video */
  #bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    transform: translate(-50%, -50%);
    object-fit: cover;
    z-index: -1;
    filter: brightness(0.35); /* darken video for text visibility */
  }

  h1 {
    font-size: clamp(2rem, 4vw, 5rem); /* responsive font */
    color: #0ff;
    text-shadow: 0 0 15px #0ff, 0 0 30px #0aa;
    margin-bottom: 1rem;
    line-height: 1.2;
  }

  .rules {
    font-size: clamp(1rem, 2vw, 1.5rem); /* responsive font */
    max-width: 800px;
    line-height: 1.6;
    margin-bottom: 2rem;
    color: #0ff;
    text-shadow: 0 0 10px #0ff;
    padding: 0 10px;
  }

  .btn {
    padding: clamp(10px, 1.5vw, 20px) clamp(20px, 3vw, 40px);
    min-width: 200px;
    background: transparent;
    border: 2px solid #0ff;
    color: #0ff;
    text-decoration: none;
    font-size: clamp(1rem, 2vw, 1.5rem);
    font-weight: bold;
    border-radius: 6px;
    box-shadow: 0 0 20px #0ff, 0 0 40px #0aa;
    transition: 0.3s;
  }

  .btn:hover {
    background: #0ff;
    color: #000;
    box-shadow: 0 0 30px #0ff, 0 0 60px #0aa, 0 0 80px #0ff;
  }

  @media (max-width: 768px) {
    .rules { line-height: 1.4; }
  }
</style>
</head>
<body>

<video autoplay muted loop id="bg-video">
  <source src="data.webm" type="video/webm">
  Your browser does not support the video tag.
</video>

<div>
  <h1>📊 Data Wrangling Challenge</h1>

  <div class="rules">
    💡 Transform messy datasets into clean, structured data.<br>
    ⚡ Analyze, clean, and merge efficiently.<br>
    🏆 The fastest and most accurate wrangler wins!<br>
    🚀 Join the ultimate data showdown at IGNITRON 2K25!
  </div>

  <a href="promptform.html" class="btn">Register Now</a>
</div>

</body>
</html>
