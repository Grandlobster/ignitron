<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Battle - IGNITRON 2K25</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f5f5f5;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      height: 100vh;
      background: #202123;
      color: #fff;
      position: fixed;
      top: 0;
      left: 0;
      transition: 0.3s;
      overflow: hidden;
    }
    .sidebar.collapsed {
      width: 60px;
    }
    .sidebar h2 {
      padding: 20px;
      font-size: 18px;
      text-align: center;
      border-bottom: 1px solid #333;
    }

    /* Chat Container */
    .chat-container {
      margin-left: 260px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
    }
    .sidebar.collapsed ~ .chat-container {
      margin-left: 60px;
    }

    /* Header */
    .chat-header {
      background: #202123;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
    }

    /* Chat box */
    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #f5f5f5;
    }

    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      margin: 8px 0;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .bot {
      background: #e5e5e5;
      color: #000;
      align-self: flex-start;
    }

    .user {
      background: #10a37f;
      color: #fff;
      align-self: flex-end;
    }

    /* Typing dots */
    .typing {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 15px;
      background: #e5e5e5;
      border-radius: 12px;
      width: fit-content;
      margin: 8px 0;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #555;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    /* Input */
    .input-container {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ccc;
      background: #fff;
    }
    .input-container input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }
    .input-container button {
      margin-left: 10px;
      padding: 12px 20px;
      background: #10a37f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Register button */
    .register-btn {
      display: block;
      margin: 15px auto;
      padding: 12px 20px;
      background: #ff5722;
      color: #fff;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      .chat-container {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Prompt Battle</h2>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <span>IGNITRON 2K25 - Prompt Battle</span>
      <i class="fa fa-moon"></i>
    </div>

    <div class="chat-box" id="chat-box"></div>

    <a href="promptform.html" class="register-btn">Register Now</a>

    <div class="input-container">
      <input type="text" id="user-input" placeholder="Type your message...">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chat-box");
    const sendBtn = document.getElementById("send-btn");
    const userInput = document.getElementById("user-input");

    function appendMessage(text, sender) {
      const msg = document.createElement("div");
      msg.classList.add("message", sender);
      msg.textContent = text;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function showTyping(callback) {
      const typingDiv = document.createElement("div");
      typingDiv.classList.add("typing");
      typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      chatBox.appendChild(typingDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      setTimeout(() => {
        typingDiv.remove();
        callback();
      }, 1200);
    }

    function typeMessage(text) {
      const msg = document.createElement("div");
      msg.classList.add("message", "bot");
      chatBox.appendChild(msg);
      let i = 0;
      const interval = setInterval(() => {
        msg.textContent += text.charAt(i);
        i++;
        if (i >= text.length) clearInterval(interval);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 30);
    }

    // Preload IGNITRON details as bot message
    const intro = `👋 Welcome to the IGNITRON 2K25 Prompt Battle!

🏆 Challenge: Use AI to create the most effective prompts. Judged on creativity, clarity, and results.

🎯 Techniques: Tree of Prompts, Chain of Thought reasoning.

💡 Rules: Prompts must run on campus devices. Best results win prizes & fee waivers.

📅 Get Ready: Prepare, strategize, and let the Prompt Battle begin!`;

    showTyping(() => typeMessage(intro));

    sendBtn.addEventListener("click", () => {
      const text = userInput.value.trim();
      if (text) {
        appendMessage(text, "user");
        userInput.value = "";
        showTyping(() => typeMessage("That's interesting! Tell me more 😃"));
      }
    });
  </script>
</body>
</html>
